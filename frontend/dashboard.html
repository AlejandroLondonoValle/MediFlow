<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFlow | Panel de Control</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js para los gráficos del Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300 font-sans antialiased text-gray-900 dark:text-white flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-all shadow-lg z-20">
        <div class="h-16 flex items-center px-6 border-b border-gray-200 dark:border-gray-700">
            <i class="fas fa-heartbeat text-2xl text-blue-600 dark:text-blue-400 mr-2"></i>
            <h1 class="text-xl font-extrabold tracking-tight">Medi<span class="text-blue-600 dark:text-blue-400">Flow</span></h1>
        </div>
        
        <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50">
            <p class="text-xs text-gray-500 dark:text-gray-400 uppercase font-semibold mb-1">Conectado como:</p>
            <div class="flex items-center">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-md">
                    <span id="user-initial">U</span>
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium capitalize" id="user-role-display">Cargando...</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="sidebar-menu">
            <!-- El menú se inyectará con JavaScript basado en el Rol -->
        </nav>

        <div class="p-4 border-t border-gray-200 dark:border-gray-700">
            <button id="btn-logout" class="flex items-center w-full px-4 py-2 text-sm font-medium text-red-600 bg-red-50 dark:bg-red-900/20 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors">
                <i class="fas fa-sign-out-alt mr-3"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Top Header -->
        <header class="h-16 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 z-10 shadow-sm">
            <h2 id="page-title" class="text-lg font-semibold">Resumen</h2>
            
            <button id="theme-toggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-yellow-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block"></i>
            </button>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 overflow-y-auto p-6 relative z-0" id="main-content">
            <!-- Blobs de fondo para darle estética al dashboard también -->
            <div class="fixed top-20 right-20 w-72 h-72 rounded-full bg-blue-500/10 blur-3xl animate-blob pointer-events-none"></div>
            <div class="fixed bottom-10 left-80 w-80 h-80 rounded-full bg-purple-500/10 blur-3xl animate-blob animation-delay-4000 pointer-events-none"></div>
            
            <!-- Contenedor dinámico de las vistas -->
            <div id="view-container" class="space-y-6 relative z-10">
                <!-- Se inyecta la vista aquí vía JS -->
            </div>
        </main>
    </div>

    <script src="./js/dashboard.js"></script>
</body>
</html>
