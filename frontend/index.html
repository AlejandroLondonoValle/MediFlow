<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFlow | Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"}
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS para animaciones extra -->
    <link rel="stylesheet" href="./css/styles.css">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 para alertas bonitas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300 font-sans antialiased text-gray-900 dark:text-white min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Elementos decorativos de fondo (Glassmorphism blobs) -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-blue-500/20 blur-3xl animate-blob"></div>
        <div class="absolute top-1/2 -right-24 w-96 h-96 rounded-full bg-purple-500/20 blur-3xl animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-24 left-1/2 w-96 h-96 rounded-full bg-cyan-500/20 blur-3xl animate-blob animation-delay-4000"></div>
    </div>

    <!-- Botón Dark Mode Toggle -->
    <button id="theme-toggle" class="absolute top-6 right-6 p-3 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-lg text-gray-800 dark:text-yellow-300 hover:scale-110 transition-transform">
        <i class="fas fa-moon dark:hidden" id="theme-toggle-dark-icon"></i>
        <i class="fas fa-sun hidden dark:block" id="theme-toggle-light-icon"></i>
    </button>

    <!-- Contenedor Principal (Glassmorphism) -->
    <main class="w-full max-w-md p-8 m-4 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl border border-white/30 dark:border-gray-700/50 rounded-3xl shadow-2xl transform transition-all hover:-translate-y-1">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 text-white mb-4 shadow-lg shadow-blue-500/30">
                <i class="fas fa-heartbeat text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 dark:text-white">Medi<span class="text-blue-600 dark:text-blue-400">Flow</span></h1>
            <p class="text-sm text-gray-600 dark:text-gray-400 mt-2">Gestión Clínica Inteligente</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" name="email" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="admin@mediflow.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white/50 dark:bg-gray-900/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300 cursor-pointer">
                        Recordarme
                    </label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 transition-colors">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform transition-transform active:scale-95">
                <span>Ingresar al Sistema</span>
                <i class="fas fa-arrow-right ml-2 mt-1 hidden group-hover:block transition-all"></i>
            </button>
        </form>

        <p class="mt-8 text-center text-xs text-gray-500 dark:text-gray-400">
            &copy; 2026 MediFlow Inc. Todos los derechos reservados.
        </p>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
